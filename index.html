<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Strength Log</title>
  <meta name="description" content="Log strength workouts and see your next session. Works offline.">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Strength Log">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    try { var t = localStorage.getItem('sl-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app"><div class="boot">Loading…</div></div>
  <div id="timer" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p style="padding:16px">Strength Log needs JavaScript turned on.</p></noscript>
</body>
</html>
